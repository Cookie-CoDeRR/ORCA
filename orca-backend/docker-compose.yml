version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 + PostGIS 3.4 + pgvector Database
  # ----------------------------------------------------------------------------
  db:
    image: postgis/postgis:15-3.4
    container_name: orca-postgis-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orca_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orca_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-orca_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orca_admin} -d ${POSTGRES_DB:-orca_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orca-network

  # ----------------------------------------------------------------------------
  # 2. MinIO S3-Compatible Scientific Object Storage
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: orca-minio-storage
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orca_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orca_minio_secret_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orca-network

  # MinIO Bucket Auto-Provisioner (Creates default buckets on startup)
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: orca-minio-provisioner
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set orca_local http://minio:9000 ${MINIO_ROOT_USER:-orca_minio_admin} ${MINIO_ROOT_PASSWORD:-orca_minio_secret_2026};
      /usr/bin/mc mb --ignore-existing orca_local/ocean-rasters;
      /usr/bin/mc mb --ignore-existing orca_local/geospatial-vectors;
      /usr/bin/mc mb --ignore-existing orca_local/agent-logs;
      /usr/bin/mc anonymous set download orca_local/ocean-rasters;
      /usr/bin/mc anonymous set download orca_local/geospatial-vectors;
      echo 'MinIO buckets (ocean-rasters, geospatial-vectors, agent-logs) successfully initialized.';
      exit 0;
      "
    networks:
      - orca-network

  # ----------------------------------------------------------------------------
  # 3. Project ORCA FastAPI Backend Gateway
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orca-fastapi-backend
    restart: always
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-orca_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orca_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-orca_db}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-orca_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-orca_minio_secret_2026}
      MINIO_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./src:/app/src
    networks:
      - orca-network

networks:
  orca-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
